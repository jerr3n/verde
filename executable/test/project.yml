# This is the sample config for the tests. TestLoadSample and TestSampleConfig load it.
version: 0
name: verde-game
serve:
  address: 127.0.0.1 # or localhost or 0.0.0.0
  port: 45678
  placeIds: [1234567890]
sync:
  instances:
    - instance: ReplicatedStorage
      path: src/shared
    - instance: ServerScriptService
      path: src/server
    - instance: StarterPlayer/StarterPlayerScripts
      path: src/local
    - instance: StarterGui
      path: src/gui
    - instance: Workspace
      path: src/workspace
    - instance: ReplicatedFirst
      path: src/first
    - instance: ServerStorage
      path: src/storage
    - instance: Lighting
      path: src/lighting
ignore:
  paths: ["**/*.tmp", "**/.DS_Store"]
  instances: ["Workspace/Camera", "Workspace/Terrain"]

conflicts:
  onConnect: disk # disk | studio | interactive